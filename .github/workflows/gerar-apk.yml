name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar o APK
        run: gradle assembleRelease --no-daemon

      - name: Renomear o APK
        run: cp app/build/outputs/apk/release/app-release.apk CasoAberto.apk

      - name: Guardar o APK na aba Actions
        uses: actions/upload-artifact@v4
        with:
          name: CasoAberto
          path: CasoAberto.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Caso Aberto 1.${{ github.run_number }}
          body: Baixe o arquivo CasoAberto.apk abaixo e instale no celular.
          files: CasoAberto.apk
          make_latest: true

  # Publica o site (página do convite + versão do jogo para navegador) no GitHub Pages
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Montar o site
        run: |
          mkdir -p _site
          cp -r docs/. _site/
          cp -r app/src/main/assets/www _site/jogo
          touch _site/.nojekyll

      - name: Configurar o Pages
        uses: actions/configure-pages@v5

      - name: Enviar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar o site
        id: publicar
        uses: actions/deploy-pages@v4
